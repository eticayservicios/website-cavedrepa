AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  cavedrepa.org — static WordPress export hosting.
  Private S3 origin behind CloudFront with Origin Access Control.

Parameters:
  ProjectName:
    Type: String
    Default: website-cavedrepa
    Description: Technical project prefix.

  SiteName:
    Type: String
    Default: cavedrepa
    Description: Site slug used in resource names.

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment.

  BucketName:
    Type: String
    Default: cavedrepa-org-prod
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid S3 bucket name.
    Description: Globally unique S3 bucket for the static export.

  DomainName:
    Type: String
    Default: cavedrepa.org
    Description: >-
      Apex domain. CloudFront uses it only when a certificate is available.
      Without HostedZoneId the stack deploys on *.cloudfront.net.

  WwwDomainName:
    Type: String
    Default: www.cavedrepa.org
    Description: Optional www hostname. Redirects to the apex when active.

  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in us-east-1.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone ID. Required for DNS and auto certificate.

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront price class.

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasWwwDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref WwwDomainName, '']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  UseProvidedCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  CreateCertificate: !And
    - !Equals [!Ref CertificateArn, '']
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]
  HasViewerCertificate: !Or
    - !Condition UseProvidedCertificate
    - !Condition CreateCertificate
  HasCustomDomain: !And
    - !Condition HasDomainName
    - !Condition HasViewerCertificate
  HasCustomWww: !And
    - !Condition HasCustomDomain
    - !Condition HasWwwDomain
  CreateApexDns: !And
    - !Condition HasHostedZone
    - !Condition HasCustomDomain
  CreateWwwDns: !And
    - !Condition HasCustomWww
    - !Condition HasHostedZone

Resources:
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - HasWwwDomain
        - - !Ref WwwDomainName
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasWwwDomain
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Ref WwwDomainName
            HostedZoneId: !Ref HostedZoneId
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${SiteName}-${Environment}-oac'
        Description: OAC for cavedrepa static S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${SiteName}-${Environment}-static-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects www to apex and maps WordPress pretty URLs to index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;

          if (host.startsWith('www.')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://' + host.slice(4) + uri }
              }
            };
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }

          if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }

          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${SiteName}-${Environment}-distribution'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Origins:
          - Id: SiteS3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRoutingFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: wp-content/*
            TargetOriginId: SiteS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: wp-includes/*
            TargetOriginId: SiteS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        Aliases: !If
          - HasCustomWww
          - - !Ref DomainName
            - !Ref WwwDomainName
          - !If
            - HasCustomDomain
            - - !Ref DomainName
            - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasViewerCertificate
          - AcmCertificateArn: !If
              - UseProvidedCertificate
              - !Ref CertificateArn
              - !Ref SiteCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  SiteDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateApexDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateApexDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteWwwDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateWwwDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteWwwDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateWwwDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: Private S3 bucket for the static export.
    Value: !Ref SiteBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID for invalidations.
    Value: !Ref SiteDistribution

  CloudFrontDomainName:
    Description: Default CloudFront domain (use until DNS is configured).
    Value: !GetAtt SiteDistribution.DomainName

  DomainName:
    Description: Target apex domain.
    Value: !Ref DomainName

  SiteUrl:
    Description: Public HTTPS URL.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${SiteDistribution.DomainName}'
