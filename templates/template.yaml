AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  cavedrepa.smartravelevents.com — static hosting plus web API.
  Private S3 origin behind CloudFront with Origin Access Control.
  REST API, Lambda stub and DynamoDB table (logic comes later).

Parameters:
  ProjectName:
    Type: String
    Default: website-cavedrepa
    Description: Technical project prefix.

  SiteName:
    Type: String
    Default: cavedrepa
    Description: Site slug used in resource names.

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment.

  BucketName:
    Type: String
    Default: cavedrepa-org-prod
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid S3 bucket name.
    Description: Globally unique S3 bucket for the static export.

  DomainName:
    Type: String
    Default: cavedrepa.smartravelevents.com
    Description: >-
      Public hostname on CloudFront. Requires HostedZoneId for DNS and ACM.
      Without HostedZoneId the stack deploys on *.cloudfront.net.

  WwwDomainName:
    Type: String
    Default: none
    Description: Optional www hostname. Use none to skip www.

  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in us-east-1.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone ID. Required for DNS and auto certificate.

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront price class.

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasWwwDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref WwwDomainName, '']]
    - !Not [!Equals [!Ref WwwDomainName, 'none']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  UseProvidedCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  CreateCertificate: !And
    - !Equals [!Ref CertificateArn, '']
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]
  HasViewerCertificate: !Or
    - !Condition UseProvidedCertificate
    - !Condition CreateCertificate
  HasCustomDomain: !And
    - !Condition HasDomainName
    - !Condition HasViewerCertificate
  HasCustomWww: !And
    - !Condition HasCustomDomain
    - !Condition HasWwwDomain
  CreateApexDns: !And
    - !Condition HasHostedZone
    - !Condition HasCustomDomain
  CreateWwwDns: !And
    - !Condition HasCustomWww
    - !Condition HasHostedZone

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 256

Resources:
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - HasWwwDomain
        - - !Ref WwwDomainName
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasWwwDomain
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Ref WwwDomainName
            HostedZoneId: !Ref HostedZoneId
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${SiteName}-${Environment}-oac'
        Description: OAC for cavedrepa static S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${SiteName}-${Environment}-static-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects www to apex and maps WordPress pretty URLs to index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;

          if (host.startsWith('www.')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://' + host.slice(4) + uri }
              }
            };
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }

          if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }

          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${SiteName}-${Environment}-distribution'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Origins:
          - Id: SiteS3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRoutingFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: wp-content/*
            TargetOriginId: SiteS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: wp-includes/*
            TargetOriginId: SiteS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        Aliases: !If
          - HasCustomWww
          - - !Ref DomainName
            - !Ref WwwDomainName
          - !If
            - HasCustomDomain
            - - !Ref DomainName
            - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasViewerCertificate
          - AcmCertificateArn: !If
              - UseProvidedCertificate
              - !Ref CertificateArn
              - !Ref SiteCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  SiteDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateApexDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateApexDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteWwwDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateWwwDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteWwwDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateWwwDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WebCoreTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${SiteName}-web-core'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Site
          Value: !Ref SiteName
        - Key: Environment
          Value: !Ref Environment

  WebApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${SiteName}-web-api'
      StageName: v1
      Description: API REST del portal web Cavedrepa.
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,PATCH,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Tags:
        Project: !Ref ProjectName
        Site: !Ref SiteName
        Environment: !Ref Environment

  WebFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SiteName}-web'
      RetentionInDays: 30

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${SiteName}-web'
      Description: Lambda del portal web Cavedrepa. Stub hasta el siguiente paso.
      CodeUri: ../functions/web/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref WebFunctionLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref WebCoreTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebCoreTable
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref WebApi
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref WebApi
            Path: /{proxy+}
            Method: ANY
      Tags:
        Project: !Ref ProjectName
        Site: !Ref SiteName
        Environment: !Ref Environment

Outputs:
  BucketName:
    Description: Private S3 bucket for the static export.
    Value: !Ref SiteBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID for invalidations.
    Value: !Ref SiteDistribution

  CloudFrontDomainName:
    Description: Default CloudFront domain (use until DNS is configured).
    Value: !GetAtt SiteDistribution.DomainName

  DomainName:
    Description: Target apex domain.
    Value: !Ref DomainName

  SiteUrl:
    Description: Public HTTPS URL.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${SiteDistribution.DomainName}'

  ApiName:
    Description: REST API Gateway name.
    Value: !Sub '${SiteName}-web-api'

  ApiUrl:
    Description: Base URL of cavedrepa-web-api (stage v1).
    Value: !Sub 'https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/v1'

  WebFunctionName:
    Description: Lambda function name.
    Value: !Ref WebFunction

  WebCoreTableName:
    Description: DynamoDB table name.
    Value: !Ref WebCoreTable
