<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — CAVEDREPA</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/images/logo.png?v=5" alt="CAVEDREPA">
        <span>
          <span class="brand-name">CAVEDREPA</span>
          <span class="brand-tag">Administración</span>
        </span>
      </a>
      <div class="admin-header-actions">
        <span class="admin-who" id="admin-who" hidden></span>
        <button class="btn btn-ghost-ink" type="button" id="admin-logout" hidden>Salir</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section admin-login" id="admin-login">
      <div class="wrap admin-login-wrap">
        <p class="eyebrow">Panel interno</p>
        <h1>Entrar</h1>
        <p>Consulta empresas, blog y mensajes de contacto.</p>
        <form class="apply-form admin-form" id="login-form">
          <label class="apply-field apply-field-wide">
            <span>Usuario o correo</span>
            <input type="text" name="user" autocomplete="username" required>
          </label>
          <label class="apply-field apply-field-wide">
            <span>Contraseña</span>
            <div class="password-field">
              <input type="password" name="password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg class="password-toggle-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5.5 0 9.5 4.5 10.5 7-1 2.5-5 7-10.5 7S2.5 14.5 1.5 12C2.5 9.5 6.5 5 12 5zm0 3.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5z"/></svg>
                <svg class="password-toggle-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 2.3 2 3.6l3.1 3.1C3.3 8.2 1.9 10 1.5 12c1 2.5 5 7 10.5 7 2 0 3.8-.6 5.3-1.5l3.1 3.1 1.3-1.3zM12 8.5a3.5 3.5 0 0 1 3.4 4.2l-4.1-4.1A3.5 3.5 0 0 1 12 8.5zm0 10.5c-4.2 0-7.6-3.1-8.8-5.5.5-1 1.5-2.4 2.9-3.6l1.6 1.6A3.5 3.5 0 0 0 12 15.5c.4 0 .7 0 1-.1l1.6 1.6c-.8.3-1.7.5-2.6.5z"/></svg>
              </button>
            </div>
          </label>
          <p class="admin-status" id="login-status"></p>
          <button class="btn btn-yellow" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <section class="section admin-app" id="admin-app" hidden>
      <div class="wrap">
        <div class="directory-tabs page-tabs" role="tablist">
          <button type="button" class="is-active" data-panel="queue">Empresas</button>
          <button type="button" data-panel="blog">Blog</button>
          <button type="button" data-panel="messages">Mensajes</button>
          <button type="button" data-panel="users">Equipo</button>
        </div>

        <div id="admin-queue">
          <div class="section-head">
            <div>
              <p class="eyebrow">Directorio interno</p>
              <h1>Empresas</h1>
            </div>
            <p class="directory-status" id="queue-status"></p>
          </div>
          <div class="admin-toolbar">
            <div class="admin-filters" id="company-filters" role="tablist" aria-label="Estado">
              <button type="button" class="is-active" data-status="">Todas</button>
              <button type="button" data-status="pending">En revisión</button>
              <button type="button" data-status="publish">Publicadas</button>
              <button type="button" data-status="rejected">Rechazadas</button>
              <button type="button" data-status="expired">Expiradas</button>
              <button type="button" data-status="other" hidden>Otras</button>
            </div>
            <div class="admin-tools">
              <label class="admin-search">
                <span>Buscar</span>
                <input type="search" id="company-search" placeholder="Nombre, RIF o correo" autocomplete="off">
              </label>
              <label class="admin-sort">
                <span>Ordenar</span>
                <select id="company-sort">
                  <option value="fecha-desc">Más recientes</option>
                  <option value="fecha">Más antiguas</option>
                  <option value="nombre">Nombre A-Z</option>
                  <option value="nombre-desc">Nombre Z-A</option>
                </select>
              </label>
            </div>
          </div>
          <div id="queue-list" class="admin-list"></div>
        </div>

        <div id="admin-blog" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">Publicaciones</p>
              <h1>Blog</h1>
            </div>
            <p class="directory-status" id="blog-status"></p>
          </div>
          <div class="admin-toolbar">
            <div class="admin-filters" id="blog-filters" role="tablist" aria-label="Estado">
              <button type="button" class="is-active" data-blog-status="">Todas</button>
              <button type="button" data-blog-status="publish">Publicadas</button>
              <button type="button" data-blog-status="draft">Borradores</button>
            </div>
            <div class="admin-tools">
              <label class="admin-search">
                <span>Buscar</span>
                <input type="search" id="blog-search" placeholder="Título o texto" autocomplete="off">
              </label>
              <button class="btn btn-yellow" type="button" id="blog-new">Nueva entrada</button>
            </div>
          </div>
          <div id="blog-list" class="admin-list"></div>
        </div>

        <div id="admin-messages" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">Contacto</p>
              <h1>Mensajes recibidos</h1>
            </div>
            <p class="directory-status" id="messages-status"></p>
          </div>
          <div id="messages-list" class="admin-list"></div>
        </div>

        <div id="admin-users" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">Accesos</p>
              <h1>Equipo</h1>
              <p>Cada persona entra con su usuario. No compartan la misma clave.</p>
            </div>
          </div>
          <form class="apply-form admin-form admin-user-form" id="user-form">
            <label class="apply-field">
              <span>Nombre</span>
              <input type="text" name="name" maxlength="80" required>
            </label>
            <label class="apply-field">
              <span>Usuario</span>
              <input type="text" name="username" maxlength="32" autocomplete="off" required>
            </label>
            <label class="apply-field apply-field-wide">
              <span>Contraseña</span>
              <div class="password-field">
                <input type="password" name="password" minlength="8" autocomplete="new-password" required>
                <button class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
                  <svg class="password-toggle-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5.5 0 9.5 4.5 10.5 7-1 2.5-5 7-10.5 7S2.5 14.5 1.5 12C2.5 9.5 6.5 5 12 5zm0 3.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5z"/></svg>
                  <svg class="password-toggle-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 2.3 2 3.6l3.1 3.1C3.3 8.2 1.9 10 1.5 12c1 2.5 5 7 10.5 7 2 0 3.8-.6 5.3-1.5l3.1 3.1 1.3-1.3zM12 8.5a3.5 3.5 0 0 1 3.4 4.2l-4.1-4.1A3.5 3.5 0 0 1 12 8.5zm0 10.5c-4.2 0-7.6-3.1-8.8-5.5.5-1 1.5-2.4 2.9-3.6l1.6 1.6A3.5 3.5 0 0 0 12 15.5c.4 0 .7 0 1-.1l1.6 1.6c-.8.3-1.7.5-2.6.5z"/></svg>
                </button>
              </div>
            </label>
            <p class="admin-status" id="user-status"></p>
            <button class="btn btn-yellow" type="submit">Agregar persona</button>
          </form>
          <div id="user-list" class="admin-list"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="admin-modal" id="admin-modal" hidden>
    <div class="admin-modal-panel" role="dialog" aria-modal="true" aria-labelledby="admin-title">
      <button class="drawer-close" type="button" id="admin-close" aria-label="Cerrar">×</button>
      <div id="admin-detail"></div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
