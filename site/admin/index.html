<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — CAVEDREPA</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/images/logo.png?v=5" alt="CAVEDREPA">
        <span>
          <span class="brand-name">CAVEDREPA</span>
          <span class="brand-tag">Administración</span>
        </span>
      </a>
      <div class="admin-header-actions">
        <span class="admin-who" id="admin-who" hidden></span>
        <button class="btn btn-ghost-ink" type="button" id="admin-logout" hidden>Salir</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section admin-login" id="admin-login">
      <div class="wrap admin-login-wrap">
        <p class="eyebrow">Panel interno</p>
        <h1>Entrar</h1>
        <p>Revisa solicitudes de afiliación y mensajes de contacto.</p>
        <form class="apply-form admin-form" id="login-form">
          <label class="apply-field apply-field-wide">
            <span>Usuario</span>
            <input type="text" name="user" autocomplete="username" required>
          </label>
          <label class="apply-field apply-field-wide">
            <span>Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <p class="admin-status" id="login-status"></p>
          <button class="btn btn-yellow" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <section class="section admin-app" id="admin-app" hidden>
      <div class="wrap">
        <div class="directory-tabs page-tabs" role="tablist">
          <button type="button" class="is-active" data-panel="queue">Solicitudes</button>
          <button type="button" data-panel="messages">Mensajes</button>
          <button type="button" data-panel="users">Equipo</button>
        </div>

        <div id="admin-queue">
          <div class="section-head">
            <div>
              <p class="eyebrow">Afiliaciones</p>
              <h1>Solicitudes en revisión</h1>
            </div>
            <p class="directory-status" id="queue-status"></p>
          </div>
          <div id="queue-list" class="admin-list"></div>
        </div>

        <div id="admin-messages" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">Contacto</p>
              <h1>Mensajes recibidos</h1>
            </div>
            <p class="directory-status" id="messages-status"></p>
          </div>
          <div id="messages-list" class="admin-list"></div>
        </div>

        <div id="admin-users" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">Accesos</p>
              <h1>Equipo</h1>
              <p>Cada persona entra con su usuario. No compartan la misma clave.</p>
            </div>
          </div>
          <form class="apply-form admin-form admin-user-form" id="user-form">
            <label class="apply-field">
              <span>Nombre</span>
              <input type="text" name="name" maxlength="80" required>
            </label>
            <label class="apply-field">
              <span>Usuario</span>
              <input type="text" name="username" maxlength="32" autocomplete="off" required>
            </label>
            <label class="apply-field apply-field-wide">
              <span>Contraseña</span>
              <input type="password" name="password" minlength="8" autocomplete="new-password" required>
            </label>
            <p class="admin-status" id="user-status"></p>
            <button class="btn btn-yellow" type="submit">Agregar persona</button>
          </form>
          <div id="user-list" class="admin-list"></div>
        </div>
      </div>
    </section>
  </main>

  <aside class="company-drawer" id="admin-drawer" hidden>
    <div class="drawer-panel" role="dialog" aria-labelledby="admin-title">
      <button class="drawer-close" type="button" id="admin-close" aria-label="Cerrar">×</button>
      <div id="admin-detail"></div>
    </div>
  </aside>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
