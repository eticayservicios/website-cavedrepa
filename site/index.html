<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cavedrepa — Bienvenidos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #1a3a2f 0%, #2d5a47 45%, #4a7c59 100%);
      color: #f5f0e8;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.7;
      opacity: 0.92;
    }
    .domain {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid rgba(245, 240, 232, 0.35);
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hola, bienvenido a Cavedrepa</h1>
    <p>
      Estamos preparando nuestro sitio web. Pronto encontrarás aquí
      toda la información sobre nuestra organización.
    </p>
    <span class="domain">cavedrepa.org</span>
  </main>
</body>
</html>
