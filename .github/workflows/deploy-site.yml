name: Deploy site content

# Sube site/ al bucket S3 e invalida CloudFront.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prod
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'

env:
  AWS_REGION: us-east-1
  STACK_NAME: website-cavedrepa-prod

jobs:
  deploy:
    name: Sync to S3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve stack outputs
        id: stack
        run: |
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output json)

          bucket=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
          distribution=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')

          if [ -z "$bucket" ] || [ "$bucket" = "null" ]; then
            echo "::error::No se encontró el stack ${STACK_NAME}. Ejecuta primero Deploy infrastructure."
            exit 1
          fi

          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"

      - name: Upload site to S3
        run: |
          aws s3 sync site/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude "index.html" \
            --exclude "404.html"

          aws s3 cp site/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          aws s3 cp site/404.html "s3://${{ steps.stack.outputs.bucket }}/404.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*"

      - name: Show site URL
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" \
            --output text)
          echo "Sitio publicado en: $url"
