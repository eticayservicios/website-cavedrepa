name: Deploy infrastructure

# S3 + CloudFront + API Gateway + Lambda + DynamoDB for www.cavedrepa.org
# Requires GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'functions/**'
      - 'scripts/**'
      - 'samconfig.toml'
      - '.github/workflows/deploy-infra.yml'

env:
  AWS_REGION: us-east-1
  STACK_NAME: website-cavedrepa-prod
  TEMPLATE_FILE: templates/template.yaml
  SITE_DOMAIN: cavedrepa.org
  WWW_DOMAIN: www.cavedrepa.org
  HOSTED_ZONE_DNS: cavedrepa.org.
  LEGACY_DOMAIN: cavedrepa.smartravelevents.com
  LEGACY_ZONE_DNS: smartravelevents.com.

jobs:
  deploy:
    name: SAM deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Falta el secret AWS_ACCESS_KEY_ID en GitHub (Settings → Secrets and variables → Actions → Secrets)."
            missing=1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Falta el secret AWS_SECRET_ACCESS_KEY en GitHub."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Resolve Route 53 hosted zones
        id: zone
        run: |
          set -euo pipefail

          lookup_zone() {
            local dns_name="$1"
            aws route53 list-hosted-zones-by-name \
              --dns-name "${dns_name}" \
              --query "HostedZones[?Name=='${dns_name}'].Id" \
              --output text | sed 's|/hostedzone/||' | awk '{print $1}'
          }

          zone_id=$(lookup_zone "${HOSTED_ZONE_DNS}")
          if [ -z "${zone_id}" ] || [ "${zone_id}" = "None" ]; then
            echo "::error::No se encontró la hosted zone ${HOSTED_ZONE_DNS} en Route 53. Créala para cavedrepa.org y apunta los NS del registrador."
            exit 1
          fi

          legacy_id=$(lookup_zone "${LEGACY_ZONE_DNS}")
          legacy_domain="${LEGACY_DOMAIN}"
          if [ -z "${legacy_id}" ] || [ "${legacy_id}" = "None" ]; then
            echo "::warning::No se encontró ${LEGACY_ZONE_DNS}; se omite el redirect desde ${LEGACY_DOMAIN}."
            legacy_id="none"
            legacy_domain="none"
          fi

          echo "id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "legacy_id=${legacy_id}" >> "$GITHUB_OUTPUT"
          echo "legacy_domain=${legacy_domain}" >> "$GITHUB_OUTPUT"
          echo "Hosted zone ${HOSTED_ZONE_DNS} → ${zone_id}"
          echo "Legacy zone ${LEGACY_ZONE_DNS} → ${legacy_id}"

      - name: Validate template
        run: sam validate --lint -t ${{ env.TEMPLATE_FILE }} --region ${{ env.AWS_REGION }}

      - name: Build
        run: sam build -t ${{ env.TEMPLATE_FILE }} --region ${{ env.AWS_REGION }}

      - name: Deploy stack
        env:
          HOSTED_ZONE_ID: ${{ steps.zone.outputs.id }}
          LEGACY_HOSTED_ZONE_ID: ${{ steps.zone.outputs.legacy_id }}
          LEGACY_DOMAIN_NAME: ${{ steps.zone.outputs.legacy_domain }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "ProjectName=website-cavedrepa" \
              "SiteName=cavedrepa" \
              "Environment=prod" \
              "BucketName=cavedrepa-org-prod" \
              "DomainName=${SITE_DOMAIN}" \
              "WwwDomainName=${WWW_DOMAIN}" \
              "LegacyDomainName=${LEGACY_DOMAIN_NAME}" \
              "HostedZoneId=${HOSTED_ZONE_ID}" \
              "LegacyHostedZoneId=${LEGACY_HOSTED_ZONE_ID}" \
              "PriceClass=PriceClass_100"

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Update admin password
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "Sin secret ADMIN_PASSWORD: se mantiene la clave generada en Secrets Manager (cavedrepa/admin)."
            exit 0
          fi
          payload=$(python3 -c 'import json,os; print(json.dumps({"username":"cavedrepa","password":os.environ["ADMIN_PASSWORD"]}))')
          aws secretsmanager put-secret-value \
            --secret-id cavedrepa/admin \
            --secret-string "${payload}"
          echo "Contraseña del panel actualizada."

      - name: Import published directory
        run: |
          pip install boto3
          python3 scripts/import_directory.py \
            --listings scripts/seed_published.json \
            --table cavedrepa-web-core \
            --region "${AWS_REGION}"
          if [ -f scripts/seed_pending.json ]; then
            python3 scripts/import_directory.py \
              --listings scripts/seed_pending.json \
              --table cavedrepa-web-core \
              --region "${AWS_REGION}" \
              --no-catalogs
          fi
          if [ -f scripts/seed_other.json ]; then
            python3 scripts/import_directory.py \
              --listings scripts/seed_other.json \
              --table cavedrepa-web-core \
              --region "${AWS_REGION}" \
              --no-catalogs
          fi
          python3 scripts/import_blog.py \
            --posts scripts/seed_blog.json \
            --table cavedrepa-web-core \
            --region "${AWS_REGION}"
