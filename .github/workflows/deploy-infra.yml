name: Deploy infrastructure

# S3 + CloudFront + API Gateway + Lambda + DynamoDB for cavedrepa.smartravelevents.com
# Requires GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'functions/**'
      - 'scripts/**'
      - 'samconfig.toml'
      - '.github/workflows/deploy-infra.yml'

env:
  AWS_REGION: us-east-1
  STACK_NAME: website-cavedrepa-prod
  TEMPLATE_FILE: templates/template.yaml
  SITE_DOMAIN: cavedrepa.smartravelevents.com
  HOSTED_ZONE_DNS: smartravelevents.com.

jobs:
  deploy:
    name: SAM deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Falta el secret AWS_ACCESS_KEY_ID en GitHub (Settings → Secrets and variables → Actions → Secrets)."
            missing=1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Falta el secret AWS_SECRET_ACCESS_KEY en GitHub."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Resolve Route 53 hosted zone
        id: zone
        run: |
          set -euo pipefail
          zone_id=$(aws route53 list-hosted-zones-by-name \
            --dns-name "${HOSTED_ZONE_DNS}" \
            --query "HostedZones[?Name=='${HOSTED_ZONE_DNS}'].Id" \
            --output text | sed 's|/hostedzone/||' | awk '{print $1}')
          if [ -z "${zone_id}" ] || [ "${zone_id}" = "None" ]; then
            echo "::error::No se encontró la hosted zone ${HOSTED_ZONE_DNS} en Route 53 de esta cuenta."
            exit 1
          fi
          echo "id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "Hosted zone ${HOSTED_ZONE_DNS} → ${zone_id}"

      - name: Validate template
        run: sam validate --lint -t ${{ env.TEMPLATE_FILE }} --region ${{ env.AWS_REGION }}

      - name: Build
        run: sam build -t ${{ env.TEMPLATE_FILE }} --region ${{ env.AWS_REGION }}

      - name: Deploy stack
        env:
          HOSTED_ZONE_ID: ${{ steps.zone.outputs.id }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "ProjectName=website-cavedrepa" \
              "SiteName=cavedrepa" \
              "Environment=prod" \
              "BucketName=cavedrepa-org-prod" \
              "DomainName=${SITE_DOMAIN}" \
              "WwwDomainName=none" \
              "HostedZoneId=${HOSTED_ZONE_ID}" \
              "PriceClass=PriceClass_100"

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Import published directory
        run: |
          pip install boto3
          python3 scripts/import_directory.py \
            --listings scripts/seed_published.json \
            --table cavedrepa-web-core \
            --region "${AWS_REGION}"
          python3 scripts/import_blog.py \
            --posts scripts/seed_blog.json \
            --table cavedrepa-web-core \
            --region "${AWS_REGION}"
