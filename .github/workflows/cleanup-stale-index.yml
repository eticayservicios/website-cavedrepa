name: Cleanup stale index

on:
  workflow_dispatch:
    inputs:
      ids:
        description: IDs de empresa separados por espacio
        required: true
      dry_run:
        description: Solo listar lo que se borraría
        type: boolean
        default: true

env:
  AWS_REGION: us-east-1

jobs:
  cleanup:
    name: Delete stale taxonomy items
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cleanup stale index
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/cleanup_stale_index.py ${{ inputs.ids }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
