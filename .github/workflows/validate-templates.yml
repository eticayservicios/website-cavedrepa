name: Validate IaC

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'samconfig.toml'
      - '.github/workflows/**'

jobs:
  validate:
    name: SAM lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate template
        run: sam validate --lint -t templates/template.yaml --region us-east-1
